# Per-repo worktree sync config.
#
# Place this at `.worktree-sync.toml` in your repository. When the WorktreeSync
# plugin creates a new worktree of this repo, it runs:
#
#     git update -> pre hooks -> copy -> clone -> symlink -> install -> post hooks
#
# Any non-zero exit aborts the whole bootstrap. If this file is absent, the
# plugin does nothing.

# Bring git up to date before anything else (runs before the pre hooks).
[git]
update = true
# Override the command if you want more than a fetch. Default shown below.
# command = ["git", "fetch", "--all", "--prune"]

# Copy gitignored files (env files, local secrets) that a fresh checkout won't
# have into the new worktree.
[copy]
enabled = true
# Default (omit `files`): recursively copy *gitignored* files whose name matches
# `patterns` — great for monorepos where env files sit in subdirectories.
# Committed files like `.env.example` are never copied (they aren't gitignored).
# patterns = [".env", ".env.*"]   # omit for these env defaults; `*` = any chars
#
# Or list relative paths, directories, or glob patterns (disables discovery):
# files = [".env", "apps/web/.env.local"]

# Make APFS copy-on-write clones. Clones behave as independent files but share
# storage until either copy changes. This phase is macOS-only and fails rather
# than falling back to a full copy when the volume does not support cloning.
[clone]
enabled = false
# files = ["models/*.bin", "fixtures", ".venv"]

# Share selected files or directories with the primary checkout. Entries may
# be exact relative paths or glob patterns. Existing destinations are replaced
# when the operation runs, including during a manual sync.
[symlink]
enabled = false
# files = [".pnpm-store", ".next/cache", "config/*.local"]

# Install dependencies. Detection is automatic from lockfiles/manifests and
# covers the major languages out of the box (node, rust, go, python, ruby, php,
# java/kotlin/scala, c#/.net, c/c++, swift, dart, elixir, erlang, haskell, r,
# perl, clojure, julia, crystal). See the README for the full table.
[install]
enabled = true
# Detection is NOT recursive: by default only the worktree root is checked and
# exactly one install command runs. In a polyglot monorepo, list each package —
# detection then runs independently in every directory. Not globbed, and a
# directory that doesn't exist aborts the bootstrap.
# dirs = ["apps/web", "services/api", "ml"]
#
# Custom rules are checked before the built-ins, so they can add a language or
# override one. First matching marker wins; `*.ext` matches by extension.
# [[install.rules]]
# marker = "flake.nix"
# command = ["nix", "develop", "--command", "true"]

# Announce the result as a herdr toast ("copied 3 files / pnpm install / uv
# sync", or the failing command). This is the only section that is on by
# default: herdr captures the plugin's stdout instead of printing it, so
# otherwise a run is invisible unless you go and read `herdr plugin log list`.
#
# NOTE: herdr suppresses every toast unless `[ui.toast] delivery` is set in
# *herdr's own* config.toml (herdr = in-app, terminal = desktop notification,
# system = OS notification service). Until then this section has no effect and
# the plugin log says so.
[notify]
# when = "always"    # default: after every run in which a phase was enabled
# when = "failure"   # only when the bootstrap aborts
# when = "never"     # stay silent

# Hooks are arbitrary commands run inside the new worktree, in order.
# Note: these are NOT run through a shell, so `&&`, pipes, `$VARS`, and
# redirects don't work — wrap them yourself with ["sh", "-c", "..."].

# pre: before file operations and install (e.g. tool setup, registry login).
# [[hooks.pre]]
# command = ["mise", "install"]

# # post: after file operations and install (e.g. env setup, codegen, build).
# [[hooks.post]]
# command = ["direnv", "allow"]

# [[hooks.post]]
# command = ["sh", "-c", "npm run codegen && npm run build"]

# # `dir` runs a hook in one package of a monorepo instead of at the root.
# [[hooks.post]]
# command = ["npm", "run", "codegen"]
# dir = "apps/web"

# What happens to the worktree when the bootstrap aborts. Every failure writes a
# full report (the failing command's own output, untruncated) and opens it in a
# herdr pane — that part is not configurable. This only decides whether the
# worktree survives.
#
# `remove` is the closest this plugin can get to "don't create the worktree if
# the bootstrap fails": herdr fires plugin events *after* the worktree, its
# workspace and its pane exist, so the only option is to undo them.
#
# It is destructive, and not the default for that reason: a bootstrap can run
# for minutes, the pane is usable the whole time, and the removal is forced (it
# has to be, or the half-written node_modules that caused the failure would
# block it) — so anything you did in that window goes with it.
[failure]
# action = "keep"     # default: leave the half-bootstrapped worktree alone
# action = "remove"   # take the worktree, its workspace and its pane back down
