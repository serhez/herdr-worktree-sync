[package]
name = "herdr-worktree-sync"
version = "0.2.0"
edition = "2024"
# herdr builds this plugin from source on the user's machine, so the toolchain
# floor is the user's problem the moment it is wrong. Declaring it turns a
# edition-2024 parse error deep in the build into cargo saying which version it
# needs.
rust-version = "1.85"
description = "Sync worktree files, install dependencies, and run hooks"
license = "MIT"
repository = "https://github.com/serhez/herdr-worktree-sync"
readme = "README.md"

[dependencies]
anyhow = "1"
glob = "0.3"
pathdiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "1.1"

[dev-dependencies]
tempfile = "3"

# The library target is auto-discovered from src/lib.rs as
# `herdr_worktree_sync`; the binary below is a thin wrapper over it so the
# worktree lifecycle stays testable from `tests/`.
[[bin]]
name = "herdr-worktree-sync"
path = "src/main.rs"
