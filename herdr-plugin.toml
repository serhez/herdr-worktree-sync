id = "serhez.herdr.worktree.sync"
name = "WorktreeSync"
version = "0.2.0"
min_herdr_version = "0.7.1"
description = "Sync worktree files, install dependencies, and run hooks"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "fetch"]

[[build]]
command = ["cargo", "build", "--release"]

# On worktree.created, run the sync binary. It reads per-repo settings
# (copy / clone / symlink / install / hooks) from the configured file inside each repo
# — see examples/worktree-sync.toml for the schema.
[[events]]
on = "worktree.created"
command = ["./target/release/herdr-worktree-sync"]

[[actions]]
id = "sync"
title = "Sync worktree files"
description = "Re-apply configured copy, clone, and symlink operations to the focused worktree"
contexts = ["workspace"]
command = ["./target/release/herdr-worktree-sync"]

# Opened by the plugin when a worktree setup fails, on a report file whose path
# arrives in $WORKTREE_SYNC_REPORT. A toast — and herdr's own dialog —
# truncates the line that says why it failed; a pane is a real terminal that
# doesn't.
#
# `less` is what keeps the pane open and scrollable; the `cat` fallback is for a
# machine without it, where a pane that closed instantly would read as a crash.
[[panes]]
id = "failure"
title = "Worktree sync failure"
placement = "overlay"
command = [
  "sh",
  "-c",
  'less -R -- "$WORKTREE_SYNC_REPORT" || { cat -- "$WORKTREE_SYNC_REPORT"; printf "\npress enter to close "; read _; }',
]
